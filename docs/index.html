<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Apothicaire du jour</title>
  <style>
    :root {
      --bg: #f4efe3;
      --card: #ffffff;
      --text: #2f2a24;
      --green: #355c3a;
      --green-dark: #26402a;
      --soft: #eef5ea;
      --shadow: 0 10px 30px rgba(0,0,0,0.08);
    }

    body {
      font-family: Georgia, serif;
      background: var(--bg);
      color: var(--text);
      max-width: 980px;
      margin: auto;
      padding: 28px;
      line-height: 1.7;
    }

    h1 {
      font-size: clamp(2.2rem, 5vw, 3.6rem);
      color: var(--green);
      margin-bottom: 18px;
    }

    .lead {
      font-size: 1.1rem;
      margin-bottom: 28px;
    }

    .card {
      background: var(--card);
      padding: 28px;
      border-radius: 22px;
      margin-top: 22px;
      box-shadow: var(--shadow);
    }

    .hero-image {
      width: 100%;
      max-width: 680px;
      max-height: 420px;
      object-fit: cover;
      border-radius: 18px;
      margin: 18px 0 26px 0;
      display: block;
      box-shadow: var(--shadow);
    }

    h2 {
      font-size: 2rem;
      margin-top: 0;
      color: var(--green-dark);
    }

    h3 {
      font-size: 1.3rem;
      margin-bottom: 8px;
      color: var(--green-dark);
    }

    .section {
      margin-top: 22px;
      padding-top: 4px;
    }

    .label {
      font-weight: bold;
      color: #2a2a2a;
      margin-bottom: 6px;
    }

    .body-text {
      white-space: pre-line;
      font-size: 1.05rem;
    }

    .quiz {
      margin-top: 22px;
      padding: 22px;
      background: var(--soft);
      border-radius: 18px;
    }

    .choice {
      margin: 10px 0;
      display: block;
    }

    button {
      margin-top: 16px;
      padding: 10px 18px;
      border: none;
      background: var(--green);
      color: white;
      border-radius: 12px;
      cursor: pointer;
      font-size: 1rem;
    }

    button:hover {
      background: var(--green-dark);
    }

    .answer {
      margin-top: 12px;
      font-weight: bold;
    }

    .meta {
      font-size: 0.95rem;
      color: #6b665f;
      margin-top: 6px;
    }

    .error {
      color: #a33;
      background: #fff2f2;
      padding: 16px;
      border-radius: 12px;
    }
  </style>
</head>

<body>
  <h1>🌿 Apothicaire du jour</h1>
  <p class="lead">Un site gratuit pour apprendre une plante par jour, avec un quiz basé sur la plante du jour.</p>

  <div id="content" class="card">Chargement...</div>

  <script>
    function escapeHtml(text) {
      return String(text ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function formatText(text) {
      return escapeHtml(text).replace(/\n/g, "<br>");
    }

    function buildQuiz(quiz) {
      return (quiz || []).map((q, index) => {
        const choicesHtml = q.choices.map(choice => `
          <label class="choice">
            <input type="radio" name="q${index}" value="${escapeHtml(choice)}">
            ${escapeHtml(choice)}
          </label>
        `).join("");

        return `
          <div class="quiz">
            <h3>Question ${index + 1}</h3>
            <p>${escapeHtml(q.question)}</p>
            ${choicesHtml}
            <button onclick="checkAnswer(${index}, ${JSON.stringify(q.answer)})">Vérifier</button>
            <div id="result${index}" class="answer"></div>
          </div>
        `;
      }).join("");
    }

    function checkAnswer(index, answer) {
      const selected = document.querySelector(`input[name="q${index}"]:checked`);
      const result = document.getElementById(`result${index}`);

      if (!selected) {
        result.textContent = "Choisis une réponse.";
        result.style.color = "#a33";
        return;
      }

      if (selected.value === answer) {
        result.textContent = "✅ Bonne réponse !";
        result.style.color = "green";
      } else {
        result.textContent = `❌ Mauvaise réponse. Réponse : ${answer}`;
        result.style.color = "#a33";
      }
    }

    async function loadPlant() {
      const content = document.getElementById("content");

      try {
        const response = await fetch("./today.json?ts=" + Date.now());
        if (!response.ok) {
          throw new Error(`Impossible de charger today.json (${response.status})`);
        }

        const data = await response.json();

        const imageBlock = data.image ? `
          <img
            src="${escapeHtml(data.image)}"
            alt="${escapeHtml(data.plant_name)}"
            class="hero-image"
          >
        ` : "";

        content.innerHTML = `
          <h2>${escapeHtml(data.plant_name)}</h2>
          <div class="meta">Mise à jour du jour : ${escapeHtml(data.date || "")}</div>

          ${imageBlock}

          <div class="section">
            <div class="label">Nom latin</div>
            <div class="body-text">${formatText(data.latin_name)}</div>
          </div>

          <div class="section">
            <div class="label">Où pousse cette plante ?</div>
            <div class="body-text">${formatText(data.where_grows)}</div>
          </div>

          <div class="section">
            <div class="label">Utilisation en cuisine</div>
            <div class="body-text">${formatText(data.culinary_uses)}</div>
          </div>

          <div class="section">
            <div class="label">Bienfaits traditionnels</div>
            <div class="body-text">${formatText(data.traditional_benefits)}</div>
          </div>

          <div class="section">
            <div class="label">Précautions</div>
            <div class="body-text">${formatText(data.precautions)}</div>
          </div>

          <div class="section">
            <div class="label">Quiz du jour</div>
            ${buildQuiz(data.quiz || [])}
          </div>
        `;
      } catch (e) {
        console.error(e);
        content.innerHTML = `
          <div class="error">
            Erreur lors du chargement de la plante du jour : ${escapeHtml(e.message)}
          </div>
        `;
      }
    }

    loadPlant();
  </script>
</body>
</html>
